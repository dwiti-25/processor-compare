# VeeR EL2 core-only synthesis config (sourced by flows/synth.sh)
# el2_veer = core without el2_mem (ICCM/DCCM/I-cache arrays) and without the JTAG TAP / DMI wrapper.
# Configuration comes from veer.config via cores/veer_el2/gen_config.sh; CFG selects the snapshot.
TOP=el2_veer
CLK_PORT=clk
PARAMS=""
DEFINES="SYNTHESIS"
EXTRA_INC="cores/veer_el2/config/${CFG:-min}"
PRE_SOURCES="cores/veer_el2/config/${CFG:-min}/el2_pdef.vh"
