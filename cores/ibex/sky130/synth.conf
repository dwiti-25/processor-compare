# Ibex core-only synthesis config (sourced by flows/synth.sh)
# lowRISC "small" config from ibex_configs.yaml: RV32IMC (Zca only), 2-stage, RV32MFast, FF regfile,
# no PMP / B / I-cache / branch predictor / writeback stage / SecureIbex / debug triggers.
TOP=ibex_top
CLK_PORT=clk_i
PARAMS="RV32E=0 RV32M=ibex_pkg::RV32MFast RV32B=ibex_pkg::RV32BNone RV32ZC=ibex_pkg::RV32Zca RegFile=ibex_pkg::RegFileFF BranchTargetALU=0 WritebackStage=0 ICache=0 ICacheECC=0 ICacheScramble=0 BranchPredictor=0 DbgTriggerEn=0 DbgHwBreakNum=1 SecureIbex=0 PMPEnable=0 MHPMCounterNum=0"
DEFINES="SYNTHESIS YOSYS"
EXTRA_INC=""
